<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Choose your plan — Klyo</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/style.css"><style>
body{background:#f6f8f4;color:#172119}main{max-width:1100px;margin:auto;padding:44px 24px}.onboarding-brand{font-size:26px;font-weight:800}h1{font-size:clamp(28px,4vw,46px);margin:32px 0 16px}p{line-height:1.6}.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:30px 0}.plan{background:#fff;color:#172119;border:1px solid #d4ddcf;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}.plan h2,.plan p{margin:0}.plan strong{font-size:32px}.plan button{margin-top:auto;white-space:normal;min-height:46px;background:#c4f451;color:#172119;border:0;border-radius:7px;font-weight:700;cursor:pointer;padding:12px}.plan small{color:#52604f}.notice{background:#e8f4d6;border:1px solid #c6dda8;border-radius:9px;padding:16px}.error{color:#942338}#logout{float:right}#retry{padding:12px}button:disabled{opacity:.55;cursor:wait}@media(max-width:850px){.plans{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.plans{grid-template-columns:1fr}main{padding:24px 16px}}
</style></head><body><main><span class="onboarding-brand">Klyo</span><button id="logout" class="btn btn-ghost"></button><h1 id="heading"></h1><p id="intro"></p><p id="notice" class="notice"></p><div id="plans" class="plans"></div><p id="error" class="error" role="alert"></p><button id="retry" hidden></button><p><a href="/terms" id="terms"></a> · <a href="/privacy" id="privacy"></a></p></main><script src="/js/api.js"></script><script src="/js/i18n.js"></script><script src="/js/onboarding.js"></script></body></html>
